<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Rock, Paper, Scissor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Deep Cosmic & Ultra-Rich Aurora Background */
        .cosmic-bg {
            background: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.28) 0%, transparent 40%),
                radial-gradient(circle at 85% 35%, rgba(168, 85, 247, 0.32) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.25) 0%, transparent 50%),
                #02040a;
        }

        /* Dynamic Animated Aurora Waves */
        .aurora-wave {
            position: fixed;
            bottom: -50px;
            left: -15%;
            right: -15%;
            height: 260px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.22), rgba(168, 85, 247, 0.3), rgba(56, 189, 248, 0.22));
            filter: blur(55px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseAurora 8s ease-in-out infinite alternate;
        }

        @keyframes pulseAurora {
            0% { transform: scale(1) translateY(0) rotate(-3deg); opacity: 0.8; }
            100% { transform: scale(1.08) translateY(-15px) rotate(2deg); opacity: 1; }
        }

        /* Advanced Liquid Glass Base with Multi-Layer Gloss & Refraction */
        .liquid-glass {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 48, 96, 0.52) 0%, rgba(12, 20, 45, 0.65) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.85),
                inset 0 -3px 8px rgba(139, 92, 246, 0.45),
                inset 0 12px 15px rgba(255, 255, 255, 0.12),
                0 10px 30px rgba(15, 23, 42, 0.6),
                0 4px 12px rgba(99, 102, 241, 0.25);
        }

        /* Specular Refraction Top Highlights */
        .liquid-glass::after {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Vibrant Gradient Rim Border */
        .liquid-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.9) 0%, rgba(96, 165, 250, 0.5) 35%, rgba(168, 85, 247, 0.7) 75%, rgba(244, 114, 182, 0.9) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Intense Glow for Main Arena Card */
        .arena-glass {
            box-shadow: 
                inset 0 2.5px 4px rgba(255, 255, 255, 0.9),
                inset 0 -4px 12px rgba(139, 92, 246, 0.6),
                inset 0 15px 20px rgba(255, 255, 255, 0.15),
                0 0 40px rgba(99, 102, 241, 0.42),
                0 15px 40px rgba(139, 92, 246, 0.35);
        }

        .arena-glass::before {
            padding: 2px;
            background: linear-gradient(135deg, #e0f2fe 0%, #3b82f6 30%, #8b5cf6 65%, #f472b6 100%);
        }

        /* Inner Sub-Cards inside Arena */
        .sub-glass {
            position: relative;
            background: linear-gradient(150deg, rgba(20, 34, 70, 0.6) 0%, rgba(8, 14, 32, 0.75) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 
                inset 0 1.5px 2.5px rgba(255, 255, 255, 0.6),
                inset 0 -2px 6px rgba(99, 102, 241, 0.35),
                inset 0 8px 10px rgba(255, 255, 255, 0.08),
                0 6px 18px rgba(0, 0, 0, 0.4);
        }

        .sub-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(96, 165, 250, 0.3), rgba(168, 85, 247, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Interactive Weapon Button Hover & Press */
        .weapon-btn {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
        }
        .weapon-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 
                inset 0 2.5px 4px rgba(255, 255, 255, 0.95),
                inset 0 -3px 10px rgba(139, 92, 246, 0.7),
                inset 0 12px 15px rgba(255, 255, 255, 0.2),
                0 14px 35px rgba(99, 102, 241, 0.6);
        }
        .weapon-btn:active {
            transform: scale(0.95);
        }

        /* Animations for Choice Reveal */
        @keyframes popReveal {
            0% { transform: scale(0.6) rotate(-8deg); opacity: 0.4; }
            65% { transform: scale(1.12) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-reveal {
            animation: popReveal 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Glossy 3D Drop Shadow on Icons */
        .icon-3d-shadow {
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
        }
    </style>
</head>
